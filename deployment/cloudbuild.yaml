steps:
  # Step 1: Build Backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/resumeapply-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/resumeapply-backend:latest'
      - './backend'

  # Step 2: Push Backend image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/resumeapply-backend']

  # Step 3: Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'resumeapply-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/resumeapply-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--timeout'
      - '3600'
      - '--set-env-vars'
      - 'GEMINI_API_KEY=$_GEMINI_API_KEY,GCS_BUCKET=$_GCS_BUCKET,PROJECT_ID=$PROJECT_ID'

  # Step 4: Build Frontend
  - name: 'node:20'
    id: 'build-frontend'
    waitFor: ['deploy-backend']
    dir: 'frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        NEXT_PUBLIC_API_URL=$_BACKEND_URL \
        NEXT_PUBLIC_WS_URL=$_BACKEND_WS_URL \
        npm run build

  # Step 5: Deploy Frontend to Firebase Hosting
  - name: 'node:20'
    id: 'deploy-frontend'
    waitFor: ['build-frontend']
    dir: 'frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --token=$_FIREBASE_TOKEN --project=$PROJECT_ID

substitutions:
  _GEMINI_API_KEY: ''
  _GCS_BUCKET: 'resumeapply-resumes'
  _FIREBASE_TOKEN: ''
  _BACKEND_URL: 'https://resumeapply-backend-uc.a.run.app'
  _BACKEND_WS_URL: 'wss://resumeapply-backend-uc.a.run.app'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/resumeapply-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/resumeapply-backend:latest'
