steps:
  # Build and Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/resumeapply-backend:$COMMIT_SHA', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/resumeapply-backend:$COMMIT_SHA']

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'resumeapply-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/resumeapply-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--set-env-vars'
      - 'GEMINI_API_KEY=$_GEMINI_API_KEY,GCS_BUCKET=$_GCS_BUCKET'

  # Deploy Frontend to Firebase Hosting
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npm run build
        npm install -g firebase-tools
        firebase deploy --only hosting --token=$_FIREBASE_TOKEN

substitutions:
  _GEMINI_API_KEY: ''
  _GCS_BUCKET: 'resumeapply-resumes'
  _FIREBASE_TOKEN: ''

images:
  - 'gcr.io/$PROJECT_ID/resumeapply-backend:$COMMIT_SHA'
